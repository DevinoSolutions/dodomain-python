[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dodomain-sdk"
dynamic = ["version"]
description = "Official Python SDK for doDomain — connect your customers' custom domains."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devino Solutions Inc.", email = "support@dodomain.io" }]
keywords = [
  "dodomain",
  "custom-domain",
  "domain-connect",
  "dns",
  "cname",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://dodomain.io"
Documentation = "https://dodomain.io/docs/api"
Repository = "https://github.com/DevinoSolutions/dodomain-python"
Issues = "https://github.com/DevinoSolutions/dodomain-python/issues"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.1",
  "ty==0.0.66",
]

[tool.hatch.version]
path = "src/dodomain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dodomain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
